<style>
:root{--bg:#FFF8F0;--cd:#fff;--tx:#5b4b49;--sub:#a8978f;--pk:#FFB5A7;--mint:#7fd3ac;--red:#f0716b;--ln:#f3e6da;--sh:0 6px 18px rgba(255,181,167,.25);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2423;--cd:#3a302e;--tx:#f4e8e2;--sub:#b5a39b;--ln:#4a3e3b;--sh:none}}
:root[data-theme="dark"]{--bg:#2b2423;--cd:#3a302e;--tx:#f4e8e2;--sub:#b5a39b;--ln:#4a3e3b;--sh:none}
*{box-sizing:border-box}body{margin:0 auto;max-width:480px;background:var(--bg);color:var(--tx);font-family:system-ui,"PingFang TC","Noto Sans TC",sans-serif;padding:0 16px 110px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 4px 10px}.top h1{font-size:20px;margin:0}.top button{font-size:22px;padding:4px 12px;border-radius:14px;background:var(--cd)}
.hero{border-radius:28px;padding:22px;margin:6px 0 14px;box-shadow:var(--sh);color:#4a3b38}.hero.ok{background:linear-gradient(135deg,#c9f2dc,#fff1c9)}.hero.bad{background:linear-gradient(135deg,#ffc9c4,#ffe0c2)}
.hero small{opacity:.7}.hero b{display:block;font-size:40px;margin:2px 0 10px}.bar{height:10px;border-radius:9px;background:rgba(255,255,255,.6);overflow:hidden}.bar i{display:block;height:100%;background:#4a3b38;opacity:.55;border-radius:9px}
.row{display:flex;justify-content:space-between;font-size:13px;margin-top:8px}.warn,.good{margin-top:12px;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.65);font-size:14px;font-weight:600}.warn{color:#d1453f}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:var(--cd);border-radius:20px;padding:14px;border:2px solid var(--ln);box-shadow:var(--sh)}.tile span{font-size:13px;color:var(--sub);display:block}.tile b{font-size:21px}.tile em{display:block;font-size:11px;color:var(--sub);font-style:normal;margin-top:2px}
h2{font-size:15px;margin:20px 4px 8px}.card{background:var(--cd);border-radius:20px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--sh)}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--ln)}.li:last-child{border:0}.li .e{font-size:22px}.li .m{flex:1;min-width:0}.li .m div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li .m small{color:var(--sub);font-size:12px}
.pos{color:#3fae7c}.neg{color:var(--red)}.x{color:var(--sub);padding:2px 8px}.date{font-size:12px;color:var(--sub);margin:12px 4px 4px}
.pill{background:var(--pk);color:#4a3b38;border-radius:14px;padding:6px 12px;font-size:13px;font-weight:600}.empty{text-align:center;color:var(--sub);padding:26px 0;font-size:14px}
summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px;list-style:none;font-weight:600}summary em{font-style:normal;color:var(--sub);font-weight:400;font-size:13px}
.mini{display:flex;gap:6px;margin-top:8px}.mini input{min-width:0;flex:1}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;align-items:center;gap:2px;width:100%;max-width:456px;background:var(--cd);border-radius:30px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
nav button{flex:1;padding:8px 0;border-radius:22px;font-size:12px;color:var(--sub)}nav button.on{background:var(--pk);color:#4a3b38;font-weight:700}nav button span{display:block;font-size:19px}
nav .fab{flex:0 0 56px;height:56px;border-radius:50%;background:var(--pk);font-size:30px;color:#4a3b38;margin:-22px 4px 0;box-shadow:var(--sh)}
#sheet{position:fixed;inset:0;display:none;z-index:20}#sheet.on{display:block}#sheet .bg{position:absolute;inset:0;background:rgba(60,40,36,.4)}
.pane{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;max-height:92%;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}.pane h3{margin:0 0 10px}
.in,.big,select{width:100%;border:2px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:16px;padding:11px 14px;font:inherit;margin:6px 0}.big{font-size:34px;font-weight:700;text-align:center}
.seg{display:flex;gap:6px;margin:6px 0}.seg button{flex:1;padding:10px;border-radius:16px;background:var(--cd);border:2px solid var(--ln)}.seg button.on,.chip.on,.sw.on{border-color:var(--pk);background:rgba(255,181,167,.35);font-weight:700}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.chip{padding:8px 0;border-radius:16px;background:var(--cd);border:2px solid var(--ln);font-size:12px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;margin-right:6px}.sw.on{border-color:var(--tx)}
.save{width:100%;margin-top:10px;padding:14px;border-radius:20px;background:var(--pk);color:#4a3b38;font-weight:700;font-size:16px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:30}#toast.on{opacity:1}
</style></head><body><div id="app"></div><nav><div id="nav"></div></nav><div id="sheet"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),ICON=document.querySelector('link[rel=icon]').href,K='doudou.v1',pad=n=>String(n).padStart(2,'0');
let S={cards:[],tx:[],wd:[],rec:[],pay:[],inv:[],plans:[],goals:[]};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=a=>a.reduce((x,t)=>x+(+t.amount||0),0),fmt=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString();
const cd=(y,m,d)=>{const t=new Date(y,m,1),Y=t.getFullYear(),M=t.getMonth(),n=new Date(Y,M+1,0).getDate();return`${Y}-${pad(M+1)}-${pad(Math.min(d,n))}`};
const today=()=>{const d=new Date();return cd(d.getFullYear(),d.getMonth(),d.getDate())};
const CATS=[['🍜','餐飲'],['🚌','交通'],['🛒','購物'],['🎮','娛樂'],['🏠','居家'],['💊','醫療'],['📚','學習'],['🎁','其他']],INC=[['💰','薪資'],['🧧','獎金'],['🪙','副業'],['🎁','其他']];
let cur=today().slice(0,7),tab='home',O={},A={},RC={},CC={},IV={};
const cardOf=id=>S.cards.find(c=>c.id===id),rem=w=>w.amount-sum(S.tx.filter(t=>t.wid===w.id));
function stats(m){const t=T().filter(x=>x.date.startsWith(m)),e=t.filter(x=>x.type==='exp'&&x.nat!=='invest'),by={};
S.cards.forEach(c=>by[c.id]=sum(e.filter(x=>x.cardId===c.id)));
const cash=sum(e.filter(x=>x.method==='cash')),card=sum(e.filter(x=>x.method==='card')),inc=sum(t.filter(x=>x.type==='inc'));
return{cash,card,by,inc,exp:cash+card,bal:inc-cash-card,invT:sum(t.filter(x=>x.type==='exp'&&x.nat==='invest')),nat:['need','want','waste'].reduce((o,k)=>(o[k]=sum(e.filter(x=>x.nat===k)),o),{none:sum(e.filter(x=>!x.nat))})}}
const nd=s=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+1);return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const rg=(a,b)=>a.slice(5).replace('-','/')+' ~ '+b.slice(5).replace('-','/');
const cyc=(c,a,b)=>sum(T().filter(x=>x.cardId===c.id&&x.type==='exp'&&x.date>=a&&x.date<=b));
const NAT={need:'🟢',want:'🟡',waste:'🔴',invest:'🔵'};let AS='goal',GI='';
const gSaved=o=>(+o.base||0)+sum(o.logs||[]),gMonth=m=>sum(S.goals.flatMap(o=>(o.logs||[]).filter(l=>l.date.startsWith(m))));
function natCard(s){const n=s.nat,L=[['need','🟢 需要','#7fd3ac'],['want','🟡 想要','#f6d365'],['waste','🔴 浪費','#f0716b'],['none','⚪ 未分類','#cfc4bd']],tot=L.reduce((a,x)=>a+n[x[0]],0);let h='';
if(tot){let acc=0;const gr=L.map(x=>{const p=acc/tot*100;acc+=n[x[0]];return`${x[2]} ${p}% ${acc/tot*100}%`}).join(',');
h=`<h2>🥧 消費品質</h2><div class="card" style="display:flex;gap:16px;align-items:center"><div style="flex:none;width:96px;height:96px;border-radius:50%;background:conic-gradient(${gr});display:grid;place-items:center"><div style="width:56px;height:56px;border-radius:50%;background:var(--cd)"></div></div><div style="flex:1;font-size:13px">${L.filter(x=>n[x[0]]).map(x=>`<div class="row" style="margin:3px 0"><span>${x[1]}</span><span>${Math.round(n[x[0]]/tot*100)}%・${fmt(n[x[0]])}</span></div>`).join('')}${n.waste/tot>.2?'<div style="font-size:12px;margin-top:8px;color:var(--red)">⚠️ 浪費佔比偏高囉</div>':''}</div></div>`}
if(s.invT)h+=`<div class="card li"><span class="e">🔵</span><div class="m"><div>投資轉帳（資產轉移）</div><small>不計入總花費</small></div><b>${fmt(s.invT)}</b></div>`;return h}
function inv(){return`<div class="seg"><button class="${AS==='goal'?'on':''}" onclick="AS='goal';R()">🎯 夢想基金</button><button class="${AS==='inv'?'on':''}" onclick="AS='inv';R()">📈 投資損益</button></div>`+(AS==='goal'?goals():invList())}
function goals(){const s=stats(cur),sv=gMonth(cur);
let h=`<div class="hero ok"><small>本月結餘（可存入夢想基金）</small><b>${fmt(s.bal)}</b><div class="row"><span>本月已存入 ${fmt(sv)}</span><span>尚可存 ${fmt(Math.max(0,s.bal-sv))}</span></div></div><h2>🎯 我的目標 <button class="pill" onclick="openGoal()">＋ 新增</button></h2>`;
return h+(S.goals.length?S.goals.map(o=>{const v=gSaved(o),p=o.target?Math.min(100,v/o.target*100):0;return`<div class="card" onclick="openGoalDetail('${o.id}')"><div class="row" style="margin:0"><b>${esc(o.name)}</b><span>${Math.round(p)}%</span></div><div class="bar" style="background:var(--ln);margin:8px 0"><i style="width:${p}%;background:var(--pk);opacity:1"></i></div><div class="row" style="margin:0"><span>已存 ${fmt(v)} / ${fmt(o.target)}</span><b>${v>=o.target?'🎉 達成！':'還差 '+fmt(o.target-v)}</b></div><button class="pill" style="margin-top:8px" onclick="event.stopPropagation();openDeposit('${o.id}')">＋ 存入</button></div>`}).join(''):'<div class="empty">設一個夢想吧：旅遊基金、出國基金… 🌴</div>')}
function openGoal(){sheet(`<h3>🎯 新增存錢目標</h3><input class="in" id="gn" placeholder="目標名稱，例：出國基金"><input class="in" id="gt" type="number" inputmode="decimal" placeholder="目標金額，例：50000"><input class="in" id="gb" type="number" inputmode="decimal" placeholder="目前已存金額（選填）"><button class="save" onclick="saveGoal()">完成 ✓</button>`)}
function saveGoal(){const n=g('gn').trim(),t=+g('gt');if(!n||!(t>0))return toast('請填名稱與目標金額');S.goals.push({id:uid(),name:n,target:t,base:+g('gb')||0,logs:[]});save();closeS();R()}
function openDeposit(id){GI=id;const o=S.goals.find(x=>x.id===id),m=today().slice(0,7),can=Math.max(0,Math.round(stats(m).bal-gMonth(m)));
sheet(`<h3>💰 存入「${esc(o.name)}」</h3><input class="big" id="da" type="number" inputmode="decimal" placeholder="0"><div class="seg">${can?`<button onclick="$('#da').value=${can}">本月結餘 ${fmt(can)}</button>`:''}<button onclick="$('#dn').value='發薪存入'">發薪存入</button></div><input class="in" id="dn" placeholder="備註（選填）"><input class="in" id="dd" type="date" value="${today()}"><button class="save" onclick="saveDeposit()">存入 ✓</button>`);setTimeout(()=>$('#da').focus(),60)}
function saveDeposit(){const a=+g('da');if(!(a>0))return toast('請輸入金額');const o=S.goals.find(x=>x.id===GI);o.logs=o.logs||[];o.logs.push({id:uid(),date:g('dd')||today(),amount:a,note:g('dn')});save();closeS();toast('存入成功 🎉');R()}
function openGoalDetail(id){GI=id;const o=S.goals.find(x=>x.id===id);if(!o)return;const v=gSaved(o),p=Math.min(100,v/o.target*100),L=o.logs||[];
sheet(`<h3>🎯 ${esc(o.name)}</h3><div class="bar" style="background:var(--ln)"><i style="width:${p}%;background:var(--pk);opacity:1"></i></div><div class="row"><span>已存 ${fmt(v)}（${Math.round(p)}%）</span><b>${v>=o.target?'🎉 達成！':'還差 '+fmt(o.target-v)}</b></div><div class="row"><span>目標 ${fmt(o.target)}</span></div><h2>存入紀錄</h2>`+(o.base?`<div class="li"><div class="m"><div>起始金額</div></div><b>${fmt(o.base)}</b></div>`:'')+(L.length?[...L].sort((a,b)=>b.date.localeCompare(a.date)).map(l=>`<div class="li"><div class="m"><div>${esc(l.note||'存入')}</div><small>${l.date}</small></div><b class="pos">+${fmt(l.amount)}</b><button class="x" onclick="delLog('${o.id}','${l.id}')">✕</button></div>`).join(''):'<div class="empty">還沒有存入紀錄</div>')+`<button class="save" onclick="openDeposit('${o.id}')">＋ 存入</button><button class="x" style="width:100%;margin-top:6px" onclick="S.goals=S.goals.filter(x=>x.id!=='${o.id}');save();closeS();R()">刪除這個目標</button>`)}
function delLog(gid,lid){const o=S.goals.find(x=>x.id===gid);o.logs=o.logs.filter(l=>l.id!==lid);save();R();openGoalDetail(gid)}
const plD=(p,k)=>cd(+p.date.slice(0,4),+p.date.slice(5,7)-1+k,+p.date.slice(8));
const plAmt=(p,k)=>{const b=Math.round(p.total/p.n);return k?b:p.total-b*(p.n-1)};
const virt=()=>S.plans.flatMap(p=>Array.from({length:p.n},(_,k)=>({id:p.id+'~'+k,date:plD(p,k),amount:plAmt(p,k),type:'exp',method:'card',cardId:p.cardId,cat:p.cat,nat:p.nat,note:p.name+'（'+(k+1)+'/'+p.n+'）'})));
const T=()=>S.tx.concat(virt()),ci=(c,a,b)=>sum(virt().filter(x=>x.cardId===c.id&&x.date>=a&&x.date<=b)),instM=m=>sum(virt().filter(x=>x.date.startsWith(m)));
function instBox(c){const t=today(),cl=stmt(c).close,L=S.plans.filter(p=>p.cardId===c.id).map(p=>({p,d:Array.from({length:p.n},(_,k)=>k).filter(k=>plD(p,k)<=t).length})).filter(x=>x.d<x.p.n||plD(x.p,x.p.n-1)>cl);
if(!L.length)return'';
return'<div class="date" style="margin-left:0">🧩 進行中的分期</div>'+L.map(({p,d})=>{const i=Math.max(d,1)-1;let r=0;for(let k=i+1;k<p.n;k++)r+=plAmt(p,k);
return`<div class="li"><div class="m"><div>${esc(p.name)}</div><small>當期 ${fmt(plAmt(p,i))}・剩餘未入帳 ${fmt(r)}（${p.n-i-1} 期）</small></div><b>${i+1}/${p.n} 期</b></div>`}).join('')}
const instUI=()=>{const a=+A.amt,n=Math.round(+A.n)||3,b=Math.round(a/n);return`<div class="seg"><button class="${A.inst?'on':''}" onclick="A.inst=!A.inst;drawAdd()">🧩 分期付款${A.inst?' ✓':''}</button></div>`+(A.inst?`<div class="seg">${[3,6,8,12].map(x=>`<button class="${n===x?'on':''}" onclick="A.n=${x};drawAdd()">${x} 期</button>`).join('')}<input class="in" style="width:84px;margin:0" type="number" inputmode="numeric" placeholder="其他" value="${[3,6,8,12].includes(n)?'':n}" oninput="A.n=this.value" onchange="drawAdd()"></div>`+(a>0&&n>1?`<small style="color:var(--sub)">每期約 ${fmt(b)}，首期 ${fmt(a-b*(n-1))}・當月只計首期，其餘自動排進之後帳單</small>`:''):'')};
function stmt(c){const t=today(),y=+t.slice(0,4),m=+t.slice(5,7)-1,cl=+c.close;let cm=m;
if(t<cd(y,m,cl))cm=m-1;const close=cd(y,cm,cl),prev=cd(y,cm-1,cl),pay=cd(y,cm+(+c.pay>cl?0:1),+c.pay);
const start=nd(prev),amt=cyc(c,start,close),paid=sum(S.pay.filter(p=>p.cardId===c.id&&p.key===close)),cs=nd(close),ce=cd(y,cm+1,cl);
return{start,close,pay,amt,key:close,paid,left:Math.max(0,amt-paid),cs,ce,camt:cyc(c,cs,ce),iamt:ci(c,start,close),ciamt:ci(c,cs,ce)}}
function runRec(){const t=today(),ym=t.slice(0,7);let ch=0;S.rec.forEach(r=>{if(r.last!==ym&&+t.slice(8)>=r.day){
S.tx.push({id:uid(),date:cd(+t.slice(0,4),+t.slice(5,7)-1,+r.day),amount:r.amount,type:r.kind,method:r.kind==='inc'?'bank':r.method,cardId:r.cardId,cat:(r.kind==='inc'?'💰':'🔁')+r.name,nat:r.kind==='inc'?'':(r.nat||'need'),note:'固定・'+r.name});r.last=ym;ch=1}});if(ch)save()}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1600)}
function sheet(h){$('#sheet').innerHTML=`<div class="bg" onclick="closeS()"></div><div class="pane">${h}</div>`;$('#sheet').classList.add('on')}
function closeS(){$('#sheet').classList.remove('on')}
const g=id=>$('#'+id).value;
function shift(k){const y=+cur.slice(0,4),m=+cur.slice(5)-1+k;cur=cd(y,m,1).slice(0,7);R()}
function R(){const[y,m]=cur.split('-');
$('#app').innerHTML=`<div class="top"><button onclick="shift(-1)">‹</button><h1><img src="${ICON}" alt="" style="width:28px;height:28px;border-radius:8px;vertical-align:-7px"> ${y} 年 ${+m} 月</h1><button onclick="shift(1)">›</button></div>`+({home,ledger,cards,fixed,inv}[tab])();
$('#nav').innerHTML=[['home','🏠','總覽'],['ledger','📒','帳本']].map(n=>nb(n)).join('')+'<button class="fab" onclick="openAdd()">＋</button>'+[['cards','💳','卡費'],['fixed','🔁','固定'],['inv','💎','資產']].map(n=>nb(n)).join('')}
const nb=n=>`<button class="${tab===n[0]?'on':''}" onclick="tab='${n[0]}';R()"><span>${n[1]}</span>${n[2]}</button>`;
function home(){const s=stats(cur),bad=s.bal<0,pct=s.inc?Math.min(100,s.exp/s.inc*100):s.exp?100:0;
let h=`<div class="hero ${bad?'bad':'ok'}"><small>本月結餘（薪資收入 − 總花費）</small><b>${fmt(s.bal)}</b><div class="bar"><i style="width:${pct}%"></i></div><div class="row"><span>薪資收入 ${fmt(s.inc)}</span><span>總花費 ${fmt(s.exp)}</span></div>${bad?`<div class="warn">⚠️ 本月透支 ${fmt(-s.bal)}，荷包喊痛囉！</div>`:s.inc?'<div class="good">🎉 本月有結餘，棒棒！</div>':''}</div>`;
h+=`<h2>本月支出</h2><div class="grid"><div class="tile"><span>💵 現金支出</span><b>${fmt(s.cash)}</b></div>`+S.cards.map(c=>{const q=stmt(c);return`<div class="tile" style="border-color:${c.color}"><span>💳 ${esc(c.name)}・本期累計</span><b>${fmt(q.camt)}</b><em>${rg(q.cs,q.ce)}（依結帳日）<br>曆月刷卡 ${fmt(s.by[c.id])}</em></div>`}).join('')+(S.cards.length?'':'<div class="tile"><span>💳 信用卡</span><em>到「固定」新增卡片</em></div>')+'</div>'+`<div class="card" style="margin-top:10px;font-size:13px"><div class="row" style="margin:0"><span>💳 本月刷卡消費</span><b>${fmt(s.card)}</b></div><small style="color:var(--sub)">刷卡當天就已計入總花費${instM(cur)?`・其中分期當期 ${fmt(instM(cur))}`:''}</small><div class="row"><span>🏦 本月已繳卡費</span><b>${fmt(paidM(cur))}</b></div><small style="color:var(--sub)">資金轉移，不計入總花費</small></div>`+natCard(s);
const t=today(),bills=S.cards.map(c=>({c,st:stmt(c)})).filter(x=>x.st.left>0);
if(bills.length)h+='<h2>🔔 信用卡待繳</h2>'+bills.map(({c,st})=>{const d=Math.ceil((new Date(st.pay)-new Date(t))/864e5);return`<div class="card li"><span class="e">💳</span><div class="m"><div>${esc(c.name)} 待繳 ${fmt(st.left)}</div><small>繳款日 ${st.pay.slice(5)}・${d<0?'逾期 '+-d+' 天':d===0?'今天要繳':d+' 天後'}</small></div><button class="pill" onclick="openPay('${c.id}')">繳款</button></div>`}).join('');
const iv=sum(S.inv.map(i=>({amount:i.value-i.cost})));
if(S.inv.length)h+=`<h2>📈 投資損益</h2><div class="card li"><div class="m">目前總損益</div><b class="${iv>=0?'pos':'neg'}">${iv>=0?'+':''}${fmt(iv)}</b></div>`;
return h}
const paidM=m=>sum(S.pay.filter(p=>p.date.startsWith(m)));let PY='';
function openPay(id){PY=id;const c=cardOf(id),st=stmt(c);sheet(`<h3>🏦 繳 ${esc(c.name)} 卡費</h3><small>上期帳單 ${rg(st.start,st.close)}・應繳 ${fmt(st.amt)}・已繳 ${fmt(st.paid)}<br>一般刷卡 ${fmt(st.amt-st.iamt)} ＋ 分期 ${fmt(st.iamt)}</small><input class="big" id="pa" type="number" inputmode="decimal" value="${st.left}"><input class="in" id="pd" type="date" value="${today()}"><small style="color:var(--sub)">卡費是資金轉移，不會重複計入總花費。可分次繳款。</small><button class="save" onclick="savePay()">確認繳款 ✓</button>`)}
function savePay(){const a=+g('pa');if(!(a>0))return toast('請輸入金額');S.pay.push({id:uid(),cardId:PY,key:stmt(cardOf(PY)).key,amount:a,date:g('pd')||today()});save();closeS();toast('已記錄繳費 ✓');R()}
function cards(){const pm=paidM(cur),sts=S.cards.map(c=>({c,st:stmt(c)})),owe=sum(sts.map(x=>({amount:x.st.left})));
let h=`<div class="hero ok"><small>本月實際繳出的卡費</small><b>${fmt(pm)}</b><div class="row"><span>目前待繳 ${fmt(owe)}</span><span>本月刷卡 ${fmt(stats(cur).card)}</span></div><div class="good">🏦 卡費是從銀行／現金付出的資金轉移，不計入總花費</div></div>`;
if(!S.cards.length)return h+'<div class="empty">先到「固定」新增信用卡</div>';
h+='<h2>各卡帳單（依結帳日）</h2>'+sts.map(({c,st})=>{const pc=st.amt?Math.min(100,st.paid/st.amt*100):0;return`<div class="card" style="border-left:8px solid ${c.color}"><b>${esc(c.name)}</b> <small style="color:var(--sub)">結帳日 ${c.close}・繳款日 ${c.pay}</small><div class="row"><span>本期累計 ${rg(st.cs,st.ce)}</span><b>${fmt(st.camt)}</b></div><small style="color:var(--sub)">尚未結帳${st.ciamt?'・含分期 '+fmt(st.ciamt):''}</small><div class="date" style="margin-left:0">上期帳單 ${rg(st.start,st.close)}・繳款日 ${st.pay.slice(5)}</div><div class="bar" style="background:var(--ln)"><i style="width:${pc}%;background:var(--pk);opacity:1"></i></div><div class="row"><span>應繳 ${fmt(st.amt)}${st.iamt?`<small>（含分期 ${fmt(st.iamt)}）</small>`:''}</span><span>已繳 ${fmt(st.paid)}</span><b class="${st.left?'neg':'pos'}">待繳 ${fmt(st.left)}</b></div>${st.left?`<button class="save" style="padding:9px;margin-top:8px" onclick="openPay('${c.id}')">繳款</button>`:st.amt?'<div style="margin-top:8px;color:#3fae7c">✅ 這期已繳清</div>':''}${instBox(c)}</div>`}).join('');
const rs=S.pay.filter(p=>p.date.startsWith(cur)).sort((a,b)=>b.date.localeCompare(a.date));
h+='<h2>🧾 本月繳費紀錄</h2>'+(rs.length?rs.map(p=>`<div class="card li"><span class="e">🏦</span><div class="m"><div>${esc((cardOf(p.cardId)||{}).name||'已刪除的卡')}</div><small>${p.date.slice(5)}・繳 ${p.key.slice(5)} 結帳那期</small></div><b>${fmt(p.amount)}</b><button class="x" onclick="S.pay=S.pay.filter(x=>x.id!=='${p.id}');save();R()">✕</button></div>`).join(''):'<div class="empty">本月還沒繳過卡費</div>');return h}
function ledger(){const wds=S.wd.filter(w=>w.date.startsWith(cur)).sort((a,b)=>b.date.localeCompare(a.date));
let h='<h2>💵 現金提領 <button class="pill" onclick="openWd()">＋ 提領</button></h2>';
h+=wds.length?wds.map(w=>{const it=S.tx.filter(t=>t.wid===w.id);return`<details class="card" ${O[w.id]?'open':''} ontoggle="O['${w.id}']=this.open"><summary><span>${w.date.slice(5)} 提領 ${fmt(w.amount)}</span><em>剩 ${fmt(rem(w))}</em></summary>`+it.map(t=>`<div class="li"><div class="m">${esc(t.note||t.cat)}</div><span>${fmt(t.amount)}</span><button class="x" onclick="delTx('${t.id}')">✕</button></div>`).join('')+`<div class="mini"><input class="in" id="n${w.id}" placeholder="花在哪？"><input class="in" id="a${w.id}" type="number" inputmode="decimal" placeholder="金額"><button class="pill" onclick="addItem('${w.id}')">加</button></div><button class="x" onclick="delWd('${w.id}')">刪除這筆提領</button></details>`}).join(''):'<div class="empty">本月還沒有提領紀錄</div>';
const tx=T().filter(t=>t.date.startsWith(cur)).sort((a,b)=>b.date.localeCompare(a.date));h+='<h2>📒 本月明細</h2>';
if(!tx.length)return h+'<div class="empty">還沒有紀錄，點下方 ＋ 記第一筆吧 🌱</div>';
let d='';tx.forEach(t=>{if(t.date!==d){d=t.date;h+=`<div class="date">${d.slice(5)}</div>`}const a=Array.from(t.cat),c=cardOf(t.cardId);
h+=`<div class="card li"><span class="e">${a[0]}</span><div class="m"><div>${esc(t.note||a.slice(1).join(''))}</div><small>${NAT[t.nat]||''} ${t.type==='inc'?'收入':t.method==='card'?'💳 '+esc(c?c.name:'信用卡'):'💵 現金'}</small></div><b class="${t.type==='inc'?'pos':''}">${t.type==='inc'?'+':'-'}${fmt(t.amount)}</b><button class="x" onclick="delTx('${t.id}')">✕</button></div>`});return h}
function delTx(id){S.tx=S.tx.filter(t=>t.id!==id);S.plans=S.plans.filter(p=>p.id!==id.split('~')[0]);save();R()}
function delWd(id){S.wd=S.wd.filter(w=>w.id!==id);S.tx.forEach(t=>{if(t.wid===id)t.wid=''});save();R()}
function addItem(id){const n=g('n'+id),a=+g('a'+id);if(!(a>0))return toast('請輸入金額');S.tx.push({id:uid(),date:today(),amount:a,type:'exp',method:'cash',cat:'🧾'+(n||'現金花費'),note:n,wid:id});O[id]=true;save();R()}
function openWd(){sheet(`<h3>💵 提領現金</h3><input class="big" id="wa" type="number" inputmode="decimal" placeholder="0"><input class="in" id="wdt" type="date" value="${today()}"><button class="save" onclick="saveWd()">完成 ✓</button>`)}
function saveWd(){const a=+g('wa');if(!(a>0))return toast('請輸入金額');S.wd.push({id:uid(),date:g('wdt')||today(),amount:a});save();closeS();R()}
const setA=(k,v)=>{A[k]=v;if(k==='type')A.cat=(v==='exp'?CATS:INC)[0].join('');drawAdd()};
function openAdd(){A={type:'exp',method:'cash',cardId:(S.cards[0]||{}).id,cat:'🍜餐飲',amt:'',note:'',date:today(),wid:'',nat:'need'};drawAdd(1)}
const seg=(k,o)=>o.map(x=>`<button class="${A[k]===x[0]?'on':''}" onclick="setA('${k}','${x[0]}')">${x[1]}</button>`).join('');
function drawAdd(f){const ex=A.type==='exp',cs=ex?CATS:INC;let m='';
if(ex){m=`<div class="seg">${seg('method',[['cash','💵 現金'],['card','💳 信用卡']])}</div>`;
if(A.method==='card')m+=S.cards.length?`<div class="seg" style="flex-wrap:wrap">${S.cards.map(c=>`<button class="${A.cardId===c.id?'on':''}" onclick="setA('cardId','${c.id}')">${esc(c.name)}</button>`).join('')}</div>`:'<div class="empty">先到「固定」新增一張信用卡喔</div>';
else{const ws=S.wd.filter(w=>rem(w)>0);if(ws.length)m+=`<select onchange="A.wid=this.value"><option value="">不指定提領</option>${ws.map(w=>`<option value="${w.id}" ${A.wid===w.id?'selected':''}>${w.date.slice(5)} 提領・剩 ${fmt(rem(w))}</option>`).join('')}</select>`}}
sheet(`<h3>記一筆</h3><div class="seg">${seg('type',[['exp','支出'],['inc','收入']])}</div><input class="big" id="amt" type="number" inputmode="decimal" placeholder="0" value="${A.amt}" oninput="A.amt=this.value"><div class="chips">${cs.map(c=>`<button class="chip ${A.cat===c.join('')?'on':''}" onclick="A.cat='${c.join('')}';drawAdd()">${c[0]}<br>${c[1]}</button>`).join('')}</div>${m}${ex?`<div class="seg">${seg('nat',[['need','🟢 需要'],['want','🟡 想要'],['waste','🔴 浪費'],['invest','🔵 投資']])}</div>`:''}${ex&&A.method==='card'&&S.cards.length?instUI():''}<input class="in" placeholder="備註（選填，分期可填項目名稱）" value="${esc(A.note)}" oninput="A.note=this.value"><input class="in" type="date" value="${A.date}" onchange="A.date=this.value"><button class="save" onclick="saveTx()">完成 ✓</button>`);
if(f)setTimeout(()=>$('#amt').focus(),60)}
function saveTx(){const a=+A.amt;if(!(a>0))return toast('請輸入金額');const ex=A.type==='exp';if(ex&&A.method==='card'&&!A.cardId)return toast('請先新增信用卡');
const n=Math.round(+A.n)||3;if(ex&&A.method==='card'&&A.inst){if(n<2||n>60)return toast('期數需為 2~60');S.plans.push({id:uid(),name:A.note||Array.from(A.cat).slice(1).join('')||'分期',total:a,n,cardId:A.cardId,date:A.date||today(),cat:A.cat,nat:A.nat})}else S.tx.push({id:uid(),date:A.date||today(),amount:a,type:A.type,method:ex?A.method:'bank',cardId:ex&&A.method==='card'?A.cardId:'',cat:A.cat,nat:ex?A.nat:'',note:A.note,wid:ex&&A.method==='cash'?A.wid:''});
cur=(A.date||today()).slice(0,7);save();closeS();toast('記好了 ✓');R()}
function fixed(){let h='<h2>🔁 固定收支排程 <button class="pill" onclick="openRec()">＋ 新增</button></h2>';
h+=S.rec.length?S.rec.map(r=>`<div class="card li"><span class="e">${r.kind==='inc'?'💰':'🔁'}</span><div class="m"><div>${esc(r.name)}</div><small>每月 ${r.day} 日・${r.kind==='inc'?'收入':r.method==='card'?'刷 '+esc((cardOf(r.cardId)||{}).name||'信用卡'):'現金'}</small></div><b class="${r.kind==='inc'?'pos':''}">${fmt(r.amount)}</b><button class="x" onclick="S.rec=S.rec.filter(x=>x.id!=='${r.id}');save();R()">✕</button></div>`).join(''):'<div class="empty">薪資、房租、訂閱都可以設在這裡，到日子自動入帳</div>';
h+='<h2>💳 信用卡 <button class="pill" onclick="openCard()">＋ 新增</button></h2>';
h+=S.cards.length?S.cards.map(c=>{const st=stmt(c);return`<div class="card li" style="border-left:8px solid ${c.color}"><div class="m"><div>${esc(c.name)}</div><small>結帳日 ${c.close}・繳款日 ${c.pay}・上期帳單 ${fmt(st.amt)}</small></div><button class="x" onclick="S.cards=S.cards.filter(x=>x.id!=='${c.id}');save();R()">✕</button></div>`}).join(''):'<div class="empty">還沒有信用卡</div>';
const ps=S.pay.slice(-5).reverse();if(ps.length)h+='<h2>🧾 繳費紀錄</h2>'+ps.map(p=>`<div class="card li"><div class="m"><div>${esc((cardOf(p.cardId)||{}).name||'已刪除的卡')}</div><small>${p.date}</small></div><b>${fmt(p.amount)}</b></div>`).join('');return h}
const sw=(o,k)=>['#FFB5A7','#A0C4FF','#B9FBC0','#FDE68A','#CDB4DB'].map(c=>`<button class="sw ${o[k]===c?'on':''}" style="background:${c}" onclick="${o===CC?'CC':'RC'}.${k}='${c}';${o===CC?'drawCard':'drawRec'}()"></button>`).join('');
function openCard(){CC={color:'#FFB5A7'};drawCard()}
function drawCard(){const n=$('#cn')?g('cn'):'',a=$('#cc')?g('cc'):'',b=$('#cp')?g('cp'):'';sheet(`<h3>新增信用卡</h3><input class="in" id="cn" placeholder="卡片名稱，例：玉山 Pi 卡" value="${esc(n)}"><input class="in" id="cc" type="number" inputmode="numeric" placeholder="每月結帳日（1-31）" value="${a}"><input class="in" id="cp" type="number" inputmode="numeric" placeholder="每月繳款日（1-31）" value="${b}"><div>${sw(CC,'color')}</div><button class="save" onclick="saveCard()">完成 ✓</button>`)}
function saveCard(){const n=g('cn').trim(),c=+g('cc'),p=+g('cp');if(!n||c<1||c>31||p<1||p>31)return toast('請填完整（日期 1-31）');S.cards.push({id:uid(),name:n,close:c,pay:p,color:CC.color});save();closeS();R()}
function openRec(){RC={kind:'inc',method:'cash',nat:'need',cardId:(S.cards[0]||{}).id};drawRec()}
const setR=(k,v)=>{RC[k]=v;drawRec()};
function drawRec(){const v=id=>$('#'+id)?g(id):'',sg=(k,o)=>o.map(x=>`<button class="${RC[k]===x[0]?'on':''}" onclick="setR('${k}','${x[0]}')">${x[1]}</button>`).join('');
sheet(`<h3>新增固定收支</h3><div class="seg">${sg('kind',[['inc','收入（薪資）'],['exp','支出（房租、訂閱）']])}</div><input class="in" id="rn" placeholder="名稱" value="${esc(v('rn'))}"><input class="in" id="ra" type="number" inputmode="decimal" placeholder="金額" value="${v('ra')}"><input class="in" id="rd" type="number" inputmode="numeric" placeholder="每月幾號（1-31）" value="${v('rd')}">`+(RC.kind==='exp'?`<div class="seg">${sg('method',[['cash','💵 現金'],['card','💳 信用卡']])}</div><div class="seg">${sg('nat',[['need','🟢 需要'],['want','🟡 想要'],['waste','🔴 浪費']])}</div>`+(RC.method==='card'?`<div class="seg" style="flex-wrap:wrap">${S.cards.map(c=>`<button class="${RC.cardId===c.id?'on':''}" onclick="setR('cardId','${c.id}')">${esc(c.name)}</button>`).join('')||'請先新增信用卡'}</div>`:''):'')+'<button class="save" onclick="saveRec()">完成 ✓</button>')}
function saveRec(){const n=g('rn').trim(),a=+g('ra'),d=+g('rd');if(!n||!(a>0)||d<1||d>31)return toast('請填完整');if(RC.kind==='exp'&&RC.method==='card'&&!RC.cardId)return toast('請先新增信用卡');
S.rec.push({id:uid(),kind:RC.kind,nat:RC.nat,name:n,amount:a,day:d,method:RC.method,cardId:RC.method==='card'?RC.cardId:''});runRec();save();closeS();R()}
function invList(){const c=sum(S.inv.map(i=>({amount:i.cost}))),v=sum(S.inv.map(i=>({amount:i.value}))),p=v-c;
let h=`<div class="hero ${p>=0?'ok':'bad'}"><small>投資總損益</small><b>${p>=0?'+':''}${fmt(p)}</b><div class="row"><span>投入 ${fmt(c)}</span><span>現值 ${fmt(v)}</span></div></div><h2>我的投資 <button class="pill" onclick="openInv()">＋ 新增</button></h2>`;
return h+(S.inv.length?S.inv.map(i=>{const q=i.value-i.cost;return`<div class="card li" onclick="openInv('${i.id}')"><span class="e">🌱</span><div class="m"><div>${esc(i.name)}</div><small>投入 ${fmt(i.cost)}・現值 ${fmt(i.value)}</small></div><b class="${q>=0?'pos':'neg'}">${q>=0?'+':''}${fmt(q)}<br><small>${i.cost?(q/i.cost*100).toFixed(1):0}%</small></b></div>`}).join(''):'<div class="empty">記下股票、基金、ETF 的成本與現值，賺賠一目了然</div>')}
function openInv(id){const i=S.inv.find(x=>x.id===id)||{};IV=id||'';sheet(`<h3>${id?'更新投資':'新增投資'}</h3><input class="in" id="iname" placeholder="名稱，例：0050" value="${esc(i.name)}"><input class="in" id="icost" type="number" inputmode="decimal" placeholder="投入成本" value="${i.cost??''}"><input class="in" id="ival" type="number" inputmode="decimal" placeholder="目前市值" value="${i.value??''}"><button class="save" onclick="saveInv()">完成 ✓</button>`+(id?`<button class="x" style="width:100%;margin-top:6px" onclick="S.inv=S.inv.filter(x=>x.id!=='${id}');save();closeS();R()">刪除這項投資</button>`:''))}
function saveInv(){const n=g('iname').trim(),c=+g('icost'),v=g('ival')===''?c:+g('ival');if(!n||!(c>=0))return toast('請填名稱與成本');
const o=S.inv.find(x=>x.id===IV);if(o)Object.assign(o,{name:n,cost:c,value:v});else S.inv.push({id:uid(),name:n,cost:c,value:v});save();closeS();R()}
runRec();R();
</script></body></html>
